<!doctype html>
<html lang="en" data-tenant="almar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2ebdd" />
    <title>Almar · Cala Verde</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // The mode is set before the first paint, so a dark-mode visitor never sees a light flash.
      try {
        var m = localStorage.getItem('luxor:mode') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.mode = m;
        var t = sessionStorage.getItem('luxor:tenant'); if (t) document.documentElement.dataset.tenant = t;
        var l = localStorage.getItem('luxor:lang'); if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
      // On the home page the hero photograph is the largest paint: ask for it now, at the same widths the page offers.
      (function () {
        var hero = (/*HEROES*/{})[document.documentElement.dataset.tenant];
        if (!hero || (location.hash && location.hash !== '#/')) return;
        var k = document.createElement('link');
        k.rel = 'preload'; k.as = 'image'; k.type = 'image/avif'; k.setAttribute('fetchpriority', 'high');
        k.setAttribute('imagesrcset', hero);
        k.setAttribute('imagesizes', '100vw');
        document.head.appendChild(k);
      })();
    </script>
    <!-- replaced at build and in dev by the SDK boundary and the early-data script, inline (vite.config.ts, luxor-early-data) -->
    <script defer src="./boundary.js"></script>
    <script defer src="./memphis-connect.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The home page's first paint: its frame and hero, rendered by the build from the components the app
      // draws (HomeHero, PageFrame), shown now and replaced by React with the same markup when it starts.
      (function () {
        try {
          if (location.hash && location.hash !== '#' && location.hash !== '#/') return;
          var d = document.documentElement;
          var shell = (/*SHELLS*/{})[d.dataset.tenant + '|' + (d.lang === 'ar' ? 'ar' : 'en')];
          if (shell) document.getElementById('root').innerHTML = shell;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
